[package]
name = "xskip"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xskip-bench"
path = "src/bin/bench.rs"

[dependencies]
libbpf-rs = "0.24"
libc = "0.2"
anyhow = "1"
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
] }
dhat = { version = "0.3", optional = true }

# Heap profile of the consume loop: who allocated, with stacks. Off by default
# because it replaces the global allocator and costs real time.
#   cargo build --release --features dhat
[features]
dhat = ["dep:dhat"]

# Symbols in release: a stripped -O2 binary profiles as one opaque frame, and
# reading the flamegraph is the point. Frame pointers come from RUSTFLAGS in
# scripts/run.sh, there is no profile key for them.
[profile.release]
debug = 1

[build-dependencies]
libbpf-cargo = "0.24"
